name: CI

# Three cheap guards that only fail on a real problem. Deliberately NO style linting: red X's on
# formatting would teach Git beginners to ignore CI. Deliberately no data-dependent test either —
# reproducing the result needs the gitignored ~9 GB, so that check lives in pipeline/02 cell 10.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No data blobs or oversized files in Git
        run: |
          data=$(git ls-files | grep -E '\.(npy|npz|tgz|tar\.gz|nii|nii\.gz|mat|h5|hdf5|parquet)$' || true)
          if [ -n "$data" ]; then
            echo "::error::Data files must not be committed (they belong in data/, which is gitignored):"
            echo "$data"
            exit 1
          fi
          big=$(git ls-files | while IFS= read -r f; do
            if [ -f "$f" ]; then
              sz=$(wc -c < "$f")
              if [ "$sz" -gt 52428800 ]; then
                echo "$((sz / 1048576))MB  $f"
              fi
            fi
          done)
          if [ -n "$big" ]; then
            echo "::error::Files larger than 50 MB should not be committed:"
            echo "$big"
            exit 1
          fi
          echo "No data blobs or oversized files. OK."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pipeline/ notebooks parse   # sandbox/ stays free for experiments
        run: |
          python -m pip install --quiet nbformat
          python - <<'PY'
          import glob, sys, nbformat
          bad = 0
          for f in sorted(glob.glob('pipeline/**/*.ipynb', recursive=True)):
              try:
                  nbformat.read(f, as_version=4)
                  print('ok', f)
              except Exception as e:
                  print('INVALID', f, e)
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Unit tests   # gammas/ invariants; no HCP data needed
        run: |
          pip install numpy scipy scikit-learn pandas && python -m unittest discover -s tests
